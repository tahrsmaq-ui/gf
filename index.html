<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعيونك</title>
    <style>
        body {
            margin: 0;
            background-color: #030303;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Tahoma', sans-serif;
        }

        .heart-container {
            position: relative;
            width: 500px;
            height: 500px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        @keyframes fallAndAssemble {
            0% {
                transform: translate(var(--rand-x), -600px) scale(0.1) rotate(45deg);
                opacity: 0;
            }
            70% {
                opacity: 1;
            }
            100% {
                transform: translate(0, 0) scale(1) rotate(var(--rot));
                opacity: 0.95;
            }
        }

        .love-word {
            position: absolute;
            color: #ff2a5f;
            font-size: 12px;
            font-weight: bold;
            text-shadow: 0 0 8px rgba(255, 42, 95, 0.6);
            white-space: nowrap;
            opacity: 0;
            animation: fallAndAssemble 1.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        .love-word:hover {
            transform: scale(1.5) rotate(0deg) !important;
            color: #ff758c;
            z-index: 10;
            text-shadow: 0 0 15px #ff758c;
        }

        .center-text {
            position: absolute;
            color: #ffffff;
            font-size: 24px;
            font-weight: bold;
            text-align: center;
            text-shadow: 0 0 20px #ff2a5f, 0 0 10px #ff2a5f;
            z-index: 5;
            pointer-events: none;
            opacity: 0;
            animation: popIn 1s ease 1.4s forwards;
        }

        @keyframes popIn {
            0% { transform: scale(0); opacity: 0; }
            80% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }

        .replay-btn {
            position: fixed;
            bottom: 30px;
            background: rgba(255, 42, 95, 0.15);
            color: #ff2a5f;
            border: 1px solid #ff2a5f;
            padding: 10px 20px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
            box-shadow: 0 0 10px rgba(255, 42, 95, 0.3);
            z-index: 100;
        }

        .replay-btn:hover {
            background: #ff2a5f;
            color: #fff;
            box-shadow: 0 0 20px #ff2a5f;
        }
    </style>
</head>
<body>

    <div class="heart-container" id="heartContainer">
        <div class="center-text">أنا بحبك ❤️</div>
    </div>

    <button class="replay-btn" onclick="initHeart()">إعادة العرض</button>

    <script>
        const words = [
            "أنا بحبك", "I Love You", "Te amo", "Je t'aime", "Ich liebe dich", 
            "Mahal kita", "Seni seviyorum", "Cinta kamu", "Aishiteru", "Kocham cię", 
            "Ti amo", "Minä rakastan sinua", "Jeg elsker dig", "عشقي", "روحي", "قلبي"
        ];

        function initHeart() {
            const container = document.getElementById('heartContainer');
            const centerText = container.querySelector('.center-text');
            container.innerHTML = '';
            container.appendChild(centerText);

            const numPoints = 110; // عدد مدروس ومناسب لعدم التداخل

            for (let i = 0; i < numPoints; i++) {
                const t = Math.PI * 2 * (i / numPoints);
                
                // معادلة رسم القلب الهندسية بدقة
                const x = 16 * Math.pow(Math.sin(t), 3);
                const y = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));

                // تكبير الحجم قليلاً وتوسيطه تماماً في الحاوية
                const posX = x * 15; 
                const posY = y * 15;

                const span = document.createElement('span');
                span.className = 'love-word';
                span.innerText = words[Math.floor(Math.random() * words.length)];
                
                // استخدام الـ transform لتعيين الموقع بدقة من المنتصف
                span.style.left = `calc(50% + ${posX}px)`;
                span.style.top = `calc(50% + ${posY}px)`;
                
                const randomRot = (Math.random() - 0.5) * 25;
                span.style.setProperty('--rot', `${randomRot}deg`);
                
                // إحداثيات عشوائية لبداية السقوط لكل كلمة
                const randXOffset = (Math.random() - 0.5) * 400;
                span.style.setProperty('--rand-x', `${randXOffset}px`);

                // تباعد زمني بالتسلسل
                span.style.animationDelay = `${i * 0.015}s`;

                container.appendChild(span);
            }
        }

        window.onload = initHeart;
    </script>
</body>
</html>
